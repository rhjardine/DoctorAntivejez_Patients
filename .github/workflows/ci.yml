name: CI — Doctor Antivejez PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    name: Build & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      # La semilla de CI se genera al vuelo y muere con el runner. Antes había un
      # literal por defecto en este archivo: al estar publicado, cualquier build
      # que lo heredara cifraba el PHI con una clave conocida. Un valor aleatorio
      # y efímero valida igual de bien y no puede filtrarse a producción.
      - name: Semilla de cifrado efímera para el build de CI
        run: echo "CI_EPHEMERAL_SEED=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build
        env:
          # El dominio del backend debe estar permitido por el connect-src de
          # public/_headers; check-release-config.mjs lo verifica antes de compilar.
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://doctor-antivejez-web.onrender.com' }}
          VITE_ENCRYPTION_SEED: ${{ secrets.VITE_ENCRYPTION_SEED || env.CI_EPHEMERAL_SEED }}

      - name: Guarda de secretos en el bundle
        run: node scripts/check-secrets.mjs

      - name: Security audit (high severity)
        run: npm audit --audit-level=high
        # Allow CI to pass even if audit finds issues (advisory only — fix separately)
        continue-on-error: true
